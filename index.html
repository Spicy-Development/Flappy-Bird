<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy Bird</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
            background: #d7f4f1;
            color: #173c45;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: radial-gradient(ellipse at 50% 10%, #f5ffdd 0, #d7f4f1 52%, #a9dcd4 100%);
            
        }

        canvas#game {
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0;
        }

        @media (max-width: 900px) and (orientation: landscape) {
            canvas#game {
                width: 640px;
                height: 480px;
            }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            canvas#game {
                width: 480px;
                height: 640px;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            height: auto;
            touch-action: manipulation;
        }

        .key {
            color: #b94f39;
        }
    </style>
    <script src="general.js" defer></script>
</head>

<body>
    <canvas id="game"></canvas>
</body>

</html>
