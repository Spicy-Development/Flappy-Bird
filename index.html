<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy Bird</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
            background: #d7f4f1;
            color: #173c45;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: radial-gradient(ellipse at 50% 10%, #f5ffdd 0, #d7f4f1 52%, #a9dcd4 100%);
            
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            height: auto;
            touch-action: manipulation;
        }

        .key {
            color: #b94f39;
        }
    </style>
    <script src="general.js" defer></script>
</head>

<body>
    <canvas id="game" width="480px" height="640px" style="position: absolute; top: 0; left: 0px; right: 0px; bottom: 0px;" aria-label=""></canvas>
</body>

</html>
