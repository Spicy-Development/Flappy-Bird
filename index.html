<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy Bird</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
            background: #d7f4f1;
            color: #173c45;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-width: 100vw;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: radial-gradient(ellipse at 50% 10%, #f5ffdd 0, #d7f4f1 52%, #a9dcd4 100%);
            
        }

        main {
            width: min(100%, 440px);
            text-align: center;
        }

        .game-frame {
            overflow: hidden;
            border: 5px solid #174b4f;
            border-radius: 8px;
            background: #8ed8d2;
            box-shadow: 0 10px 0 #174b4f, 0 18px 30px #174b4f30;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: manipulation;
        }

        .key {
            color: #b94f39;
        }
    </style>
    <script src="general.js" defer></script>
</head>

<body>
    <main>
        <div class="game-frame">
            <canvas id="game" width="100%" height="100%" aria-label="Flappy Bird game"></canvas>
        </div>
    </main>
</body>

</html>
